# Synthetic trading book. This is NOT any real firm's book.
#
# Sizes are target GBP market values on the start date (negative = short).
# Quantities are derived from start-date prices so the book is internally
# consistent. Daily trades are random but seeded, so every run is reproducible.
#
# Rates: quantity is zero-coupon face value; the target is its present value.
# FX:    quantity is an amount of the foreign currency held.

start: 2024-01-02
seed: 20240102
daily_trade_probability: 0.08
trade_size_range: [0.02, 0.10]   # fraction of the starting size, either direction

